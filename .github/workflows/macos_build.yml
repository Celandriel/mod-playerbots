name: macos-build
on:
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "macos-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  macos-build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    # Deliberately no -Wfatal-errors: it stops each translation unit at its first
    # diagnostic, so a single run reports one problem per file and hides the rest.
    env:
      CXXFLAGS: "-Wall -Wextra -Winit-self -Woverloaded-virtual -Werror -Wno-error=deprecated-declarations"
    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v4
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}
      # No `repository:` here on purpose: this workflow lives in mod-playerbots, so
      # actions/checkout picks up the event context and checks out the pull request
      # merged into its target branch (refs/pull/N/merge). Naming the repository
      # explicitly would silently check out its default branch instead, and the build
      # would grade code the pull request does not contain.
      - name: Checkout Playerbot Module
        uses: actions/checkout@v4
        with:
          path: 'modules/mod-playerbots'
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache:${{ matrix.os }}:${{ github.ref }}:${{ github.sha }}
          restore-keys: |
            ccache:${{ matrix.os }}:${{ github.ref }}
            ccache:${{ matrix.os }}
      - name: Install latest bash
        run: brew install bash
      - name: Configure OS
        run: source ./acore.sh install-deps
      - name: Build
        run: source ./apps/ci/mac/ci-compile.sh
