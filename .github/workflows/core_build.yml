name: ubuntu-build

on:
  push:
    branches: [ "master", "test-staging" ]
  pull_request:
    branches: [ "master", "test-staging" ]

concurrency:
  group: "core-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
        # the result of the matrix will be the combination of all attributes, so we get os*compiler builds
        include:
          - os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    # Deliberately no -Wfatal-errors: it stops each translation unit at its first
    # diagnostic, so a single run reports one problem per file and hides the rest.
    env:
      CXXFLAGS: "-Wall -Wextra -Winit-self -Woverloaded-virtual -Werror -Wno-error=deprecated-declarations"

    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@v3
        with:
          repository: 'mod-playerbots/azerothcore-wotlk'
          ref: ${{ (github.base_ref || github.ref_name) == 'test-staging' && 'test-staging' || 'Playerbot' }}

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          
      # No `repository:` here on purpose: this workflow lives in mod-playerbots, so
      # actions/checkout picks up the event context and checks out the pull request
      # merged into its target branch (refs/pull/N/merge). Naming the repository
      # explicitly would silently check out its default branch instead, and the build
      # would grade code the pull request does not contain.
      - name: Checkout Playerbot Module
        uses: actions/checkout@v3
        with:
          path: 'modules/mod-playerbots'
      
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/var/ccache
          key: ccache:${{ matrix.os }}:${{ matrix.c_compiler }}:${{ github.ref }}:${{ github.sha }}
          restore-keys: |
            ccache:${{ matrix.os }}:${{ matrix.c_compiler }}:${{ github.ref }}
            ccache:${{ matrix.os }}:${{ matrix.c_compiler }}
            ccache:${{ matrix.os }}

      - name: Install Requirements
        run: sudo apt-get update && sudo apt-get install ccache git cmake make gcc g++ clang libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev mysql-server libboost-all-dev

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      # `-- -k` keeps make going after a target fails, so one run lists every file that
      # needs fixing instead of only the first few. The build still fails: make exits
      # non-zero if anything failed, and cmake --build propagates that.
      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -- -k
